# Visualisation

# Default for the optional Smart Panel accessory on wrist_3_link.
# Override with the smart_panel xacro / launch argument.
smart_panel: true

mesh_files:
  base:
    visual:
      mesh:
        package: ur_description
        path: meshes/ur17g-1300/visual/base.dae
    collision:
      mesh:
        package: ur_description
        path: meshes/ur17g-1300/collision/base.stl
